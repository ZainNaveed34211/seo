# GitHub Pages deployment for seo.kluzar.com — v2 recommended workflow.
# Paste this file manually via the GitHub website (the API cannot create
# workflow files without workflows permission). It deploys ONLY on pushes
# to main, so pushing a feature branch does NOT deploy anything.
# Before the first deploy from main:
#   - Settings > Pages source = "GitHub Actions"
#   - Repository variable VITE_WORKER_URL = https://seo-api.kluzar.com
#     (canonical public Worker URL; kluzar-seo-audit is the Worker name)
#   - Repository variable VITE_PACKS_URL = pack-selection URL, or leave
#     unset while pack selection is not live (locked features then show
#     an honest "not live yet" message instead of a fake payment link)
# No Worker secrets, no GitHub tokens, and no payment credentials are
# used in this workflow. VITE_* variables are public build configuration.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_WORKER_URL: ${{ vars.VITE_WORKER_URL }}
          VITE_PACKS_URL: ${{ vars.VITE_PACKS_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
