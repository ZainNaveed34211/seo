# GitHub Pages deployment for seo.kluzar.com.
# This workflow only runs on pushes to main, so pushing a feature branch
# (for example seo-audit-v1) does NOT deploy anything.
# Before the first deploy from main, set the repository's Pages source to
# "GitHub Actions" in Settings > Pages, and set the repository variable
# VITE_WORKER_URL to the Worker URL (see WORKER_SETUP.md). If the variable
# is not set, the build still succeeds, but live audits show a clear
# "Worker not configured" message instead of faking an audit.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_WORKER_URL: ${{ vars.VITE_WORKER_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
